name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-and-notebook-ci:
    name: Python & Notebook Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Ruff Lint Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Run Ruff Formatting Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

      - name: Validate Notebook JSON Syntax
        run: |
          python -c "
          import json, glob
          for nb in glob.glob('notebooks/*.ipynb'):
              with open(nb) as f:
                  json.load(f)
              print(f'Valid notebook JSON: {nb}')
          "

  terraform-ci:
    name: Terraform Quality & Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Formatting Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
